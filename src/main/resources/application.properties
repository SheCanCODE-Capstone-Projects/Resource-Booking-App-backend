spring.application.name=Resource-Booking-App-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=jdbc:postgresql://localhost:5432/resource_booking
spring.datasource.username=postgres
spring.datasource.password=123

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy}
spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

jwt.secret=${JWT_SECRET:a-long-local-test-secret-at-least-32-characters}

BREVO_API=${BREVO_API_KEY:dummy}
BREVO_MAIL=${BREVO_SENDER_EMAIL:test@example.com}
BREVO_SENDER_NAME=${BREVO_SENDER_NAME:Test}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
app.security.dev-user=local-tester
spring.application.name=Resource-Booking-App-backend


spring.datasource.url=jdbc:postgresql://localhost:5432/resource_booking
spring.datasource.username=postgres
spring.datasource.password=123

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# Flyway migration configuration

spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}



BREVO_API=${BREVO_API_KEY:dummy}
BREVO_MAIL=${BREVO_SENDER_EMAIL:test@example.com}
BREVO_SENDER_NAME=${BREVO_SENDER_NAME:Test}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
app.security.dev-user=local-tester
spring.application.name=Resource-Booking-App-backend

server.request.header.forwarded.strategy=framework

# Which environment's config (application-dev/production.properties) to load.
# Override with the SPRING_PROFILES_ACTIVE env var — Railway must set this to "production".
#spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.config.import=optional:file:.env[.properties]

# Database connectivity credentials
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}


# Spring JPA configurations
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# Flyway migration configuration

spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# OAuth authentication credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# redirect-uri is identical across profiles: {baseUrl} resolves from the incoming
# request itself (localhost locally, the Railway host in production)
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# JWT secret credentials
jwt.secret=${JWT_SECRET}

# Brevo email service
brevo.api-key=${BREVO_API}
brevo.sender-mail=${BREVO_MAIL}
brevo.sender-name=${BREVO_SENDER_NAME}

# Server configuration
server.port=${PORT:8080}

# Swagger/OpenAPI  serve docs under /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
